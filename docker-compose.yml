# CMS de soyroman.com en Hall.
#   docker compose --env-file .env.hall up -d --build
# Ruta: Cloudflare → tunnel-main → nginx-proxy → soyroman-cms:3000 (red homeserver-network)
services:
  cms:
    build:
      context: .
      args:
        # URL pública del sitio (SEO/metadata apuntan a soyroman.com, no al CMS)
        NEXT_PUBLIC_SERVER_URL: ${FRONTEND_URL}
        PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
        FRONTEND_URL: ${FRONTEND_URL}
    image: soyroman-cms:latest
    container_name: soyroman-cms
    restart: unless-stopped
    env_file: .env.hall
    environment:
      CMS_ROLE: cms
      CMS_URL: http://localhost:3000
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@soyroman-db:5432/${POSTGRES_DB}
    ports:
      - '127.0.0.1:${CMS_PORT:-3011}:3000' # solo para pruebas locales; el tráfico entra por nginx
    networks:
      - default
      - homeserver-network
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: soyroman-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.hall}
    volumes:
      - soyroman-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  soyroman-pg:

networks:
  homeserver-network:
    external: true
